name: Docker

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose:
    name: compose-build-and-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 准备 CI 环境变量
        run: |
          cat > .env <<'EOF'
          PETCLINIC_MYSQL_ROOT_PASSWORD=ci-root-password
          PETCLINIC_DB_PASSWORD=ci-db-password
          PETCLINIC_JWT_SECRET=ci-jwt-secret-for-github-actions-0123456789
          EOF

      - name: 校验 Compose 配置
        run: docker compose config --quiet

      - name: 构建并启动，验证健康和种子数据
        run: |
          docker compose up -d --build --wait --wait-timeout 360
          curl -fsS http://127.0.0.1:8088/api/actuator/health
          curl -fsS -o /dev/null http://127.0.0.1:8088/api/uploads/seed/doctor-01.jpg
          curl -fsS -o /dev/null http://127.0.0.1:8088/healthz

      - name: 失败时输出日志
        if: failure()
        run: docker compose logs --tail=200

      - name: 清理
        if: always()
        run: docker compose down -v