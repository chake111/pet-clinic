name: Docker

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose:
    name: compose-build-and-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 准备 CI 环境变量
        run: |
          cat > .env <<'EOF'
          YUZHUA_MYSQL_ROOT_PASSWORD=ci-root-password
          YUZHUA_DB_PASSWORD=ci-db-password
          YUZHUA_JWT_SECRET=ci-jwt-secret-for-github-actions-0123456789
          EOF

      - name: 校验 Compose 配置
        run: docker compose config --quiet

      - name: 构建并启动，验证健康和种子数据
        run: |
          docker compose up -d --build --wait --wait-timeout 360
          curl -fsS http://127.0.0.1:8088/api/actuator/health
          curl -fsS -o /dev/null http://127.0.0.1:8088/api/uploads/seed/doctor-01.jpg
          curl -fsS -o /dev/null http://127.0.0.1:8088/api/uploads/seed/doctor-13.jpg
          curl -fsS -o /dev/null http://127.0.0.1:8088/api/uploads/seed/pet-11.jpg
          curl -fsS -o /dev/null http://127.0.0.1:8088/healthz

      - name: 校验就绪、指标端点与 nginx 拦截
        run: |
          # 先打一次业务接口，确保 http.server.requests 有样本
          curl -fsS -o /dev/null http://127.0.0.1:8088/api/client/catalog/home
          curl -fsS http://127.0.0.1:8088/api/actuator/health/readiness
          docker compose exec -T backend sh -c \
            "curl -fsS http://127.0.0.1:8081/api/actuator/prometheus | grep -q '^http_server_requests_seconds'"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8088/api/actuator/metrics)" = "404"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8088/api/actuator/prometheus)" = "404"

      - name: 失败时输出日志
        if: failure()
        run: docker compose logs --tail=200

      - name: 清理
        if: always()
        run: docker compose down -v