name: Localize Dependabot PR

# Dependabot 触发的 pull_request 运行只有只读 token，无法改标题。
# 这里用 pull_request_target 拿写权限，但只读事件元数据、检出 base 分支，
# 且仅当 PR 作者是 dependabot[bot]、分支来自本仓库时才执行。
on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  localize:
    if: >
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 检出 base 分支
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          persist-credentials: false

      - name: 本地化标题
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          TITLE: ${{ github.event.pull_request.title }}
        run: node .github/scripts/localize-dependabot.mjs